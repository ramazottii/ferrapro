<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FerraPro · Sepet</title>
  <meta name="theme-color" content="#0B1E38" />
  <link rel="icon" href="/logo/ferrapro-favicon.png?v=1" type="image/png" />
  <link rel="apple-touch-icon" href="/logo/ferrapro-apple.png?v=1" />
  <link rel="stylesheet" href="/site.css?v=81" />
</head>
<body>
  <div class="bar">
    <span>İstanbul saha teslim</span>
    <a href="/sepet">Sepetim</a>
  </div>
  <header class="head">
    <a class="logo" href="/">
      <img src="/logo/ferrapro-header.png?v=1" alt="FerraPro" />
    </a>
    <form class="seek" role="search">
      <input id="q" type="search" placeholder="Ürün ara" />
    </form>
    <a class="bag" href="/sepet">Sepetim <b data-bag>0</b></a>
  </header>
  <div class="rail">
    <button class="rail-btn" id="chip-prev" type="button">‹</button>
    <div class="chips" id="chips"></div>
    <button class="rail-btn" id="chip-next" type="button">›</button>
  </div>
  <section class="cart-box">
    <h1>Sepetim</h1>
    <table>
      <thead>
        <tr>
          <th>Ürün</th>
          <th>Fiyat</th>
          <th>Adet</th>
          <th>Tutar</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cart-rows"></tbody>
    </table>
    <div class="sum" id="cart-sum"></div>
  </section>
  <section class="ask">
    <h2>Sipariş</h2>
    <form id="siparis-form" class="checkout">
      <label>Firma<input name="firma" required /></label>
      <label>Yetkili<input name="yetkili" /></label>
      <label class="full">Telefon<input name="tel" required /></label>
      <div class="full">
        <button type="submit">Siparişi gönder</button>
        <p id="siparis-msg" class="empty"></p>
      </div>
    </form>
  </section>
  <footer class="foot">
    <img src="/logo/ferrapro.png?v=1" alt="FerraPro" />
    FerraPro · İstanbul
  </footer>
  <script src="/vitrin.js?v=20"></script>
</body>
</html>
