<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FerraPro — logo seçenekleri</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #e8e4db; color: #1c1f1d; }
    h1 { margin: 0 0 4px; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .note { margin: 0 0 12px; font-size: 0.75rem; color: #5c5a54; }
    .wrap { padding: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    figure { margin: 0; background: #fff; border: 1px solid #cfc9bb; padding: 10px; }
    figure.wide { grid-column: 1 / -1; }
    img { width: 100%; height: 160px; object-fit: contain; background: #faf8f3; display: block; }
    figure.dark img { background: #1c1f1d; }
    figcaption { margin-top: 8px; font-size: 0.75rem; color: #5c5a54; }
    .n { font-weight: 650; color: #1c1f1d; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>FerraPro — ferrapro.com</h1>
    <p class="note">D fayans + B yazı birleşik üstte — FER (Ayfer) · RA (Ramazan) · PRO</p>
    <div class="grid">
      <figure class="wide">
        <img src="logo/ferrapro-fayans-ust.png" alt="Fayans üstte FERRAPRO altta" />
        <figcaption><span class="n">M</span> — petrol fayans üstte, FERRAPRO altta</figcaption>
      </figure>
      <figure class="wide">
        <img src="logo/ferrapro-lockup.png" alt="Kilit: FR + FERRAPRO renk" />
        <figcaption><span class="n">A</span> — FR işaret + FER / RA / PRO renk</figcaption>
      </figure>
      <figure class="wide">
        <img src="logo/ferrapro-yazi.png" alt="Sadece FERRAPRO yazı" />
        <figcaption><span class="n">B</span> — sadece yazı, FER / RA / PRO</figcaption>
      </figure>
      <figure>
        <img src="logo/ferrapro-kare.png" alt="Kare FR işaret" />
        <figcaption><span class="n">C</span> — kare FR işaret</figcaption>
      </figure>
      <figure>
        <img src="logo/ferrapro-fayans.png" alt="Petrol fayans FR" />
        <figcaption><span class="n">D</span> — petrol fayans (uygulama ikonu)</figcaption>
      </figure>
      <figure>
        <img src="logo/ferrapro-muhur.png" alt="Mühür FerraPro" />
        <figcaption><span class="n">E</span> — mühür</figcaption>
      </figure>
      <figure>
        <img src="logo/ferrapro-istif.png" alt="Üstte FR altta FERRAPRO" />
        <figcaption><span class="n">F</span> — istif (üst işaret, alt yazı)</figcaption>
      </figure>
      <figure class="wide">
        <img src="logo/ferrapro-camel.png" alt="FerraPro karma büyük harf" />
        <figcaption><span class="n">G</span> — FerraPro (Ferra siyah, Pro petrol)</figcaption>
      </figure>
      <figure class="wide">
        <img src="logo/ferrapro-pro-kucuk.png" alt="FERRA ve küçük PRO" />
        <figcaption><span class="n">H</span> — FERRA + küçük PRO eki</figcaption>
      </figure>
      <figure class="wide dark">
        <img src="logo/ferrapro-koyu.png" alt="Koyu zemin FerraPro" />
        <figcaption><span class="n">I</span> — koyu zemin</figcaption>
      </figure>
      <figure class="wide">
        <img src="logo/ferrapro-tek-renk.png" alt="Tek renk petrol FerraPro" />
        <figcaption><span class="n">J</span> — tek renk petrol</figcaption>
      </figure>
      <figure class="wide">
        <img src="logo/ferrapro-ince.png" alt="İnce klas FerraPro" />
        <figcaption><span class="n">K</span> — ince / klas</figcaption>
      </figure>
      <figure class="wide">
        <img src="logo/ferrapro-masthead.png" alt="FERRA üstte PRO altta" />
        <figcaption><span class="n">L</span> — dergi başlığı (FERRA / PRO)</figcaption>
      </figure>
    </div>
  </div>
</body>
</html>
