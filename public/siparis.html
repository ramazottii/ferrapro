<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teklif Talebi · FerraPro</title>
  <meta name="description" content="İşletmeniz için teklif isteyin. İhtiyaç duyduğunuz ürünleri ve miktarlarını paylaşın." />
  <meta name="theme-color" content="#142238" />
  <link rel="icon" href="/logo/ferrapro-hex.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css?v=60" />
</head>
<body>
  <header class="head" data-head="/siparis"></header>
  <main class="wrap page">
    <h1>İşletmeniz için teklif isteyin</h1>
    <p class="lead">İhtiyaç duyduğunuz ürünleri ve miktarlarını paylaşın.</p>
    <p id="wa-wrap" hidden><a class="btn" id="wa" href="#">WhatsApp</a></p>
    <form class="form" id="siparis-form">
      <p class="full form-hint">Zorunlu alanlar yıldız (*) ile işaretlidir.</p>
      <label>
        <span class="etiket">Firma adı <span class="gerekli" aria-hidden="true">*</span></span>
        <input name="firma" required autocomplete="organization" />
      </label>
      <label>
        <span class="etiket">Yetkili adı</span>
        <input name="yetkili" autocomplete="name" />
      </label>
      <label>
        <span class="etiket">Telefon <span class="gerekli" aria-hidden="true">*</span></span>
        <input name="tel" required autocomplete="tel" />
      </label>
      <label>
        <span class="etiket">Ürün kategorisi</span>
        <select name="grup">
          <option value="">Seçin</option>
          <option value="Hijyen">Temizlik Kâğıt Ürünleri</option>
          <option value="Sağlık Sarf">Sağlık Sarf</option>
          <option value="Temizlik">Temizlik Ürünleri</option>
          <option value="Mutfak / İkram">Mutfak / İkram</option>
          <option value="Ambalaj">Ambalaj</option>
          <option value="Kırtasiye">Kırtasiye Ürünleri</option>
          <option value="PC Sarf">Bilgisayar ve Yazıcı Sarf Malzemeleri</option>
        </select>
      </label>
      <label>
        <span class="etiket">Teslimat ilçesi</span>
        <input name="ilce" maxlength="80" autocomplete="address-level2" />
      </label>
      <label class="full">
        <span class="etiket">İhtiyaç duyduğunuz ürünler ve miktarlar&nbsp;<span class="gerekli" aria-hidden="true">*</span></span>
        <textarea name="not" rows="4" required placeholder="Ürün ve miktar"></textarea>
      </label>
      <p class="full form-kvkk">Kişisel verileriniz <a href="/kvkk">KVKK aydınlatma metni</a> kapsamında işlenir.</p>
      <div class="full">
        <button class="btn" type="submit">Teklif Talebi Gönder</button>
        <p id="msg" class="note" role="status"></p>
      </div>
    </form>
  </main>
  <footer class="foot" data-foot></footer>
  <script src="/site.js?v=60"></script>
</body>
</html>
