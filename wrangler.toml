name = "tedarik"
main = "src/worker.js"
compatibility_date = "2026-08-23"
account_id = "9f0d39ce0db57f09bc1769c9ddf0c344"
workers_dev = true

[vars]
QUOTE_NOTIFY_FROM = "info@ferrapro.com"
# QUOTE_NOTIFY_TO is a Worker secret, never committed personal addresses.

[[send_email]]
name = "QUOTE_EMAIL"
allowed_sender_addresses = ["info@ferrapro.com"]

[[routes]]
pattern = "tedarik.ferranoi.com"
custom_domain = true

[[routes]]
pattern = "ferrapro.com"
custom_domain = true

[[routes]]
pattern = "www.ferrapro.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "KV"
id = "cb3d2d882810406285ed1364e4583ec3"

# Anonymous contact attempts, per Cloudflare location. Allows shared office IPs.
[[ratelimits]]
name = "QUOTE_RATE_LIMITER"
namespace_id = "2026100501"
simple = { limit = 20, period = 60 }

[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "ferrapro_events"

[[ratelimits]]
name = "METRIC_RATE_LIMITER"
namespace_id = "2026100502"
simple = { limit = 120, period = 60 }
